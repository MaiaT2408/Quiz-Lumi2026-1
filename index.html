<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Lumi</title>
  <style>
    body { font-family: Arial; background: #00FFA5; text-align: center; padding: 50px; }
  .quiz { background: purple; padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; }
    input { padding: 12px; width: 80%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
    button { margin: 10px; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #4CAF50; color: white; }
    #msg { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="quiz" id="quiz"></div>

  <script>
    const perguntas = [
      {
        fase: "FASE 1 - GINÁSIO PEDRA - Brock",
        pergunta: "Quem é o seu professor preferido?",
        resposta: ["Moraes", "Anne", "Eictor", "Amanda"] // Aceita várias respostas
      },
      {
        fase: "FASE 2 - MATEMÁTICA POKÉMON",
        pergunta: "Ash tem 26 insígnias. Ele precisa de 32 pra ir pra Liga. Quantas faltam?",
        resposta: ["6", "seis"] // Aceita número ou escrito
      },
      {
        fase: "FASE 3 - ENIGMA",
        pergunta: "Um treinador tem 3 Pokébolas. Ele captura 1 e usa 2 e erra. Quantas sobraram?",
        resposta: ["0", "zero"]
      },
      {
        fase: "FASE 4 - VITÓRIA",
        pergunta: "PARABÉNS MESTRE POKÉMON! Digite 'VENCEU' para finalizar.",
        resposta: ["venceu"]
      }
    ];

    let atual = 0;
    const quizDiv = document.getElementById("quiz");

    function carregarPergunta() {
      const p = perguntas[atual];
      quizDiv.innerHTML = `
        <h2>${p.fase}</h2>
        <h3>${p.pergunta}</h3>
        <input type="text" id="resposta" placeholder="Digite sua resposta aqui">
        <br>
        <button onclick="checar()">Enviar Resposta</button>
        <p id="msg"></p>
      `;
      // Aperta Enter pra enviar
      document.getElementById("resposta").addEventListener("keypress", function(e) {
        if(e.key === "Enter") checar();
      });
    }

    function checar() {
      const input = document.getElementById("resposta").value;
      const msg = document.getElementById("msg");

      // Normaliza: tira espaço, acento e deixa minúsculo
      const respostaUsuario = input.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      // Confere se a resposta está no array de respostas corretas
      const acertou = perguntas[atual].resposta.some(gabarito =>
        respostaUsuario === gabarito.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      );

      if(acertou) {
        msg.innerHTML = "✅ Acertou! Avançando...";
        msg.style.color = "green";
        setTimeout(() => {
          atual++;
          if(atual < perguntas.length) carregarPergunta();
        }, 1200);
      } else {
        msg.innerHTML = "❌ Resposta errada! Tente de novo.";
        msg.style.color = "red";
        document.getElementById("resposta").value = ""; // limpa o campo
      }
    }

    carregarPergunta();
  </script>
</body>
</html>
