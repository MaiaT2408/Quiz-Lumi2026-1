<script>
  const perguntas = [
    {
      fase: "Questao 1 - Mais facil impossivel",
      pergunta: "Quem e seu professor preferido?",
      resposta: ["amanda", "anne", "bruna", "caipira", "eictor", "gabrielle", "joao", "simel", "adriana", "matheus", "moraes", "giovanna", "luciana", "leonardo", "lucas", "rodrigo", "rita", "heloiza"]
    },
    {
      fase: "Questao 2 - Facil",
      pergunta: "Que horas comecam as aulas?",
      resposta: ["7:25", "sete e vinte e cinco", "7h25", "07:25"]
    },
    {
      fase: "Questao 3 - Continua simples",
      pergunta: "Que horas acabam as aulas?", // <-- ESSA LINHA QUE FALTAVA
      resposta: ["12:25", "meio dia e vinte e cinco"]
    },
    {
      fase: "Questao 4 - Igual pilotar carro automatico",
      pergunta: "Quem e o melhor pokemon de todos os tempos?",
      resposta: ["1", "bulbassauro", "bulbasaur"]
    },
    {
      fase: "Questao 5 - Mais facil que andar pra frente",
      pergunta: "Quem e a diretora do colegio?",
      resposta: ["rose"]
    },
    {
      fase: "Questao 6 - Comecemos com a parte logica",
      pergunta: "Quantas senhas numericas de 5 digitos podem ser construidas?",
      resposta: ["100000", "100000"] // 10^5
    },
    {
      fase: "Questao 7 - Essa vai cansar um pouco",
      pergunta: "Quantas lixeiras tem na escola considerando apenas patio, salas de aula, e banheiros?",
      resposta: ["dez", "10"]
    },
    {
      fase: "Questao 8 - Essa tambem",
      pergunta: "Qual e a soma dos numeros das portas de todas as salas do FundII?",
      resposta: ["dez", "10"]
    },
    {
      fase: "Questao 9 - Razoável",
      pergunta: "Qual o décimo oitavo número da sequência de Fibonacci?",
      resposta: ["cinquenta e cinco", "55"]
    },
    {
      fase: "Questao 10 - Razoável",
      pergunta: "Qual o décimo primeiro número da sequência de Fibonacci?",
      resposta: ["oitenta e nove", "89"]
    },
    {
      fase: "Questao 11",
      pergunta: "Qual o maior deserto do planeta?",
      resposta: ["antartida"]
    },
    {
      fase: "Questao 12",
      pergunta: "Se um estudante tirou 10 na ava, 5 na pesquisa e producao, e 10 na autoavaliacao, quanto ele tem de tirar na argumentativa pra ficar com 7 de média?",
      resposta: ["cinco", "5"]
    },
    {
      fase: "Questao 13",
      pergunta: "Se um estudante tirou 10 na ava, 5 na pesquisa e producao, e 10 na autoavaliacao, quanto ele tem de tirar na argumentativa pra ficar com 7 de média?",
      resposta: ["cinco", "5"]
    }
  

  ];

  let atual = 0;

  function normalizar(texto) {
    return texto.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function carregarPergunta() {
    const p = perguntas[atual];
    document.getElementById("quiz").innerHTML = `
      <h2>${p.fase}</h2>
      <h3>${p.pergunta}</h3>
      <input type="text" id="respostaInput" placeholder="Digite sua resposta">
      <br>
      <button id="btnEnviar">Enviar Resposta</button>
      <p id="msg"></p>
    `;
    
    const input = document.getElementById("respostaInput");
    const botao = document.getElementById("btnEnviar");
    
    botao.onclick = checar;
    
    // CARACTERÍSTICA 1: ENVIAR COM ENTER
    input.addEventListener("keypress", function(e) {
      if(e.key === "Enter") {
        checar();
      }
    });
    
    input.focus();
  }

  function checar() {
    let input = document.getElementById("respostaInput").value;
    let respostaUsuario = normalizar(input);
    let msg = document.getElementById("msg");

    let acertou = perguntas[atual].resposta.some(g => normalizar(g) === respostaUsuario);

    if(acertou) {
      msg.innerHTML = "✅ ACERTOU!";
      msg.style.color = "green";
      setTimeout(() => {
        atual++;
        if(atual < perguntas.length) {
          carregarPergunta();
        } else {
          document.getElementById("quiz").innerHTML = "<h1>🏆 VOCE VENCEU!</h1>";
        }
      }, 1000);
    } else {
      msg.innerHTML = "❌ ERROU! Tente de novo";
      msg.style.color = "red";
      document.getElementById("respostaInput").value = ""; // limpa o campo
      
      // CARACTERÍSTICA 2: SUMIR A MENSAGEM EM 2 SEGUNDOS
      setTimeout(() => {
        msg.innerHTML = ""; // apaga a mensagem
      }, 2000); // 2000 = 2 segundos
    }
  }

  carregarPergunta();
</script>
