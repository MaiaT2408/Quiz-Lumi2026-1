<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Pokémon</title>
  <style>
    body { font-family: Arial; background: #00FFA5; text-align: center; padding: 50px; }
   .quiz { background: white; padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px #0003; }
    input { padding: 12px; width: 80%; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; }
    button { margin: 10px; padding: 12px 25px; font-size: 16px; background: #CC0000; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #FF0000; }
    #msg { font-weight: bold; margin-top: 15px; font-size: 18px; min-height: 25px; }
  </style>
</head>
<body>
  <div class="quiz" id="quiz"></div>

  <script>
    // AQUI VOCÊ EDITA AS PERGUNTAS
    const perguntas = [
      {
        fase: "Questão 1 - Mais fácil impossível",
        pergunta: "Quem é seu professor preferido?",
        resposta: ["Amanda", "Anne"]
      },
      {
        fase: "Questão 2 - Fácil",
        pergunta: "Que horas começam as aulas?",
        resposta: ["7:25", "sete e vinte e cinco"]
      }
    ];

    let atual = 0;

    function normalizar(texto) {
      return texto.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function carregarPergunta() {
      const p = perguntas[atual];
      document.getElementById("quiz").innerHTML = `
        <h2>${p.fase}</h2>
        <h3>${p.pergunta}</h3>
        <input type="text" id="respostaInput">
        <br>
        <button id="btnEnviar">Enviar Resposta</button>
        <p id="msg"></p>
      `;
      document.getElementById("btnEnviar").onclick = checar; // Linka o botão
      document.getElementById("respostaInput").focus();
    }

    function checar() {
      let input = document.getElementById("respostaInput").value;
      let respostaUsuario = normalizar(input);
      let msg = document.getElementById("msg");

      let acertou = perguntas[atual].resposta.some(g => normalizar(g) === respostaUsuario);

      if(acertou) {
        msg.innerHTML = "✅ ACERTOU!";
        msg.style.color = "green";
        setTimeout(() => {
          atual++;
          if(atual < perguntas.length) {
            carregarPergunta();
          } else {
            document.getElementById("quiz").innerHTML = "<h1>🏆 VOCÊ VENCEU!</h1>";
          }
        }, 1000);
      } else {
        msg.innerHTML = `❌ ERROU! Tente: ${input}`;
        msg.style.color = "red";
      }
    }

    carregarPergunta(); // Começa o jogo
  </script>
</body>
</html>
