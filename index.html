<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz Lumi 2026</title>
  <style>
    body { font-family: Arial; background: #00FF88; text-align: center; padding: 30px; margin: 0; }
  .quiz { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: 50px auto; box-shadow: 0 4px 10px #0003; }
    h2 { color: #007AFF; }
    h3 { color: #333; }
    input { padding: 12px; width: 90%; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; margin: 10px 0; }
    button { margin: 10px; padding: 12px 25px; font-size: 16px; background: #007AFF; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #msg { font-weight: bold; margin-top: 15px; font-size: 18px; min-height: 25px; }
  </style>
</head>
<body>
  <div class="quiz" id="quiz">Carregando...</div>

<script>
  const perguntas = [
    {
      fase: "Questao 1 - Mais facil impossivel",
      pergunta: "Quem e seu professor preferido?",
      resposta: ["amanda", "anne", "bruna", "caique", "eictor", "gabrielle", "joao", "simei", "adriana", "matheus", "moraes", "geovanna", "adriana", "matheus", "luciana", "leonardo", "lucas", "rodrigo", "rita", "heloiza", "cristiane"]
    },
    {
      fase: "Questao 2 - Facil",
      pergunta: "Que horas comecam as aulas?",
      resposta: ["7:25", "sete e vinte e cinco", "7h25", "07:25"]
    },
    {
      fase: "Questao 3 - Continua simples",
      pergunta: "Que horas acabam as aulas?",
      resposta: ["12:25", "meio dia e vinte e cinco", "meiodia e vinte e cinco"]
    },
    {
      fase: "Questao 4 - Igual pilotar carro automatico",
      pergunta: "Quem e o melhor pokemon de todos os tempos?",
      resposta: ["1", "bulbassauro", "bulbasaur"]
    },
    {
      fase: "Questao 5 - Mais facil que andar pra frente",
      pergunta: "Quem e a diretora do colegio?",
      resposta: ["rose"]
    },
    {
      fase: "Questao 6 - Comecemos com a parte logica",
      pergunta: "Quantas senhas numericas de 5 digitos podem ser construidas?",
      resposta: ["30240"]
    },
    {
      fase: "Questao 7 - Essa vai cansar um pouco",
      pergunta: "Quantas lixeiras tem na escola considerando apenas patio, salas de aula, e banheiros?",
      resposta: ["dez", "10"]
    },
    {
      fase: "Questao 7 - Essa também",
      pergunta: "Qual a soma dos números das portas de todas as salas do fundII?",
      resposta: ["dez", "10"]
    },
    {
      fase: "Questao 7 - Essa vai cansar um pouco",
      pergunta: "Quem ?",
      resposta: ["dez", "10"]
    }
  ];

  let atual = 0;

  function normalizar(texto) {
    return texto.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function carregarPergunta() {
    const p = perguntas[atual];
    document.getElementById("quiz").innerHTML = `
      <h2>${p.fase}</h2>
      <h3>${p.pergunta}</h3>
      <input type="text" id="respostaInput" placeholder="Digite sua resposta">
      <br>
      <button id="btnEnviar">Enviar Resposta</button>
      <p id="msg"></p>
    `;
    document.getElementById("btnEnviar").onclick = checar;
    document.getElementById("respostaInput").focus();
  }

  function checar() {
    let input = document.getElementById("respostaInput").value;
    let respostaUsuario = normalizar(input);
    let msg = document.getElementById("msg");

    let acertou = perguntas[atual].resposta.some(g => normalizar(g) === respostaUsuario);

    if(acertou) {
      msg.innerHTML = "✅ ACERTOU!";
      msg.style.color = "green";
      setTimeout(() => {
        atual++;
        if(atual < perguntas.length) {
          carregarPergunta();
        } else {
          document.getElementById("quiz").innerHTML = "<h1>🏆 VOCE VENCEU!</h1>";
        }
      }, 1000);
    } else {
      msg.innerHTML = `❌ ERROU! Tente de novo`;
      msg.style.color = "red";
    }
  }

  carregarPergunta();
</script>
</body>
</html>
